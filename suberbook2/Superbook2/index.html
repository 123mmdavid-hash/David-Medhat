<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحاتي</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .page-one {
            min-height: 100vh;
            background-image: url('photo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .overlay {
            width: 100%;
            max-width: 400px;
            background: transparent;
            border-radius: 16px;
            padding: 25px 20px;
            margin-top: 170px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }



        .link-btn {
    display: block;
    text-align: center;
    padding: 10px 20px;
    color: #ffffff;
    text-decoration: none;
    border-radius: 25px;
    font-size: 14px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    transition: 0.3s ease;
    width: 300px;
max-width: 90%;
    max-width: 600px;
    margin: 0 auto;
}

/* Facebook */
.link-btn:nth-child(1) {
    background-color: #1877F2;
}

.link-btn:nth-child(1):hover {
    background-color: #0d65d9;
    transform: scale(1.05);
}

/* Instagram */
.link-btn:nth-child(2) {
    background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
}

.link-btn:nth-child(2):hover {
    transform: scale(1.05);
}




        .page-two {
            min-height: 100vh;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="page-two">
    <video controls style="width: 100%; max-width: ;">
        <source src="video.mp4" type="video/mp4">
    </video>
</div>

<div class="page-one">
    <div class="overlay">
        <div class="links">
            <a class="link-btn" href="https://www.facebook.com/share/1F7SR6UhKS/" target="_blank">facebook</a>
            <a class="link-btn" href="https://www.instagram.com/superbook_team?igsi=MWRiNThobDd3YWZmMg==" target="_blank">instagram</a>
        </div>
    </div>
</div>

</body>
</html>
